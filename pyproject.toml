[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apcm-opportunity-lab"
version = "0.2.0"
description = "Explainable public-data and beneficiary-month APCM analytics prototype"
requires-python = ">=3.11"
dependencies = [
  "dbt-duckdb>=1.8,<2",
  "duckdb>=1.0,<2",
  "pandas>=2.2,<4",
  "streamlit>=1.39,<2",
]

[tool.setuptools.packages.find]
where = ["src"]


name: Real-data pipeline

# Runs the download and analysis steps on GitHub's runners, which have open
# internet access to CMS, HRSA, CDC and Census. Raw data never enters Git;
# only aggregate outputs, manifests and logs under pipeline_output/ are committed.

on:
  push:
    branches: [real-data-rebuild, main]
    paths:
      - "pipeline/**"
      - "models/**"
      - "seeds/**"
      - "tests/**"
      - "dbt_project.yml"
      - "requirements.txt"
      - "dashboard/template.html"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore staged data cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: staged-${{ github.run_id }}
          restore-keys: staged-
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h .
      - name: Run pipeline job
        run: |
          mkdir -p pipeline_output
          set -o pipefail
          bash pipeline/run.sh 2>&1 | tee pipeline_output/last_run.log
      - name: Save staged data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/processed
          key: staged-${{ github.run_id }}
      - name: Commit outputs
        if: always()
        run: |
          mkdir -p pipeline_output
          echo "run_id=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }} finished=$(date -u +%FT%TZ)" > pipeline_output/last_run_status.txt
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add -f pipeline_output
          [ -f dashboard/index.html ] && git add dashboard/index.html
          git commit -m "Pipeline output from run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
